<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOALWIRE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg,#0f172a,#1e3a8a,#0f172a);
  color:white;
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
  font-size:28px;
  font-weight:bold;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}

/* TABS */
.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

.tabs button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#38bdf8;
  font-weight:bold;
  cursor:pointer;
}

/* INVITE */
.invite{
  text-align:center;
  margin:10px;
}

.invite a{
  background:#22c55e;
  color:black;
  padding:12px 18px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
}

/* CARDS */
.card{
  background:rgba(255,255,255,0.08);
  margin:10px;
  padding:15px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);
}

/* LIVE */
.live{
  color:#22c55e;
  font-weight:bold;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{opacity:0.4;}
}
</style>
</head>

<body>

<header>⚽ GOALWIRE PRO LIVE</header>

<div class="invite">
  <a href="https://discord.com/oauth2/authorize?client_id=1509585232070967306&permissions=0&scope=bot%20applications.commands" target="_blank">
    🤖 Invite Bot
  </a>
</div>

<!-- LEAGUE TABS -->
<div class="tabs">
  <button onclick="loadLeague(39)">EPL</button>
  <button onclick="loadLeague(140)">La Liga</button>
  <button onclick="loadLeague(2)">UCL</button>
</div>

<div id="output"></div>

<script>

const API_KEY = "YOUR_API_FOOTBALL_KEY";
const output = document.getElementById("output");

// 🔥 LOAD LIVE LEAGUE MATCHES
async function loadLeague(league){
  const res = await fetch(`https://v3.football.api-sports.io/fixtures?league=${league}&season=2025`, {
    headers:{ "x-apisports-key": API_KEY }
  });

  const data = await res.json();

  let html = "<h2 style='text-align:center'>Matches</h2>";

  data.response.slice(0,8).forEach(m=>{
    html += `
      <div class="card">
        <b>${m.league.name}</b><br>
        ⚽ ${m.teams.home.name} ${m.goals.home ?? 0} - ${m.goals.away ?? 0} ${m.teams.away.name}<br>
        ⏱ ${m.fixture.status.elapsed ?? 0}'
        <div class="live">LIVE</div>
      </div>
    `;
  });

  output.innerHTML = html;
}

// AUTO LOAD EPL
loadLeague(39);

// AUTO REFRESH EVERY 60s
setInterval(()=>loadLeague(39),60000);

</script>

</body>
</html>
